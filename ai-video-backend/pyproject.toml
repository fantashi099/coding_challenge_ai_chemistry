[project]
name = "ai-chemistry-video-service"
version = "0.1.0"
description = "LLM-scripted animated chemistry video generator"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<1",
  "manim>=0.19,<0.20",
  "piper-tts>=1.3,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
